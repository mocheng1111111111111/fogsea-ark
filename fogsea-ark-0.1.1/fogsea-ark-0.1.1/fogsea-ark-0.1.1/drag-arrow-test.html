<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>拖拽箭头动效对比</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:#07111c;color:#eaf7ff;font-family:Inter,"Noto Sans SC",system-ui,sans-serif;
    background-image:radial-gradient(circle at 15% 0%,rgba(46,134,181,.16),transparent 34%),radial-gradient(circle at 90% 100%,rgba(92,76,190,.13),transparent 36%)}
  header{max-width:1240px;margin:auto;padding:34px 28px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  h1{margin:0;font-size:26px;letter-spacing:2px}
  header p{margin:8px 0 0;color:#8da9b8;font-size:13px;line-height:1.7}
  button{border:1px solid rgba(143,227,208,.28);background:rgba(143,227,208,.08);color:#bff7ea;border-radius:9px;padding:9px 15px;cursor:pointer}
  button:hover{background:rgba(143,227,208,.15)}
  footer{max-width:1240px;margin:auto;padding:0 28px 30px;color:#557486;font-size:11px}
  .compare{max-width:1240px;margin:0 auto 30px;padding:0 28px}
  .compareBar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  h2{margin:0;font-size:18px}
  .status{display:flex;gap:4px;padding:3px;border:1px solid #2b4652;border-radius:8px}
  .status button{display:flex;align-items:center;gap:7px;border:0;border-radius:5px;background:none;color:#8da9b8;padding:6px 10px}
  .status button::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--swatch)}
  .status button[aria-pressed="true"]{background:#203747;color:#eaf7ff}
  .compareGrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .compareGrid article{position:relative;overflow:hidden;border:1px solid rgba(143,227,208,.14);border-radius:10px;background:rgba(10,25,37,.78);
    box-shadow:0 16px 40px rgba(0,0,0,.18)}
  .compareGrid .info{padding:13px 14px 10px}
  .compareGrid h3{margin:0;font-size:14px}
  .compareGrid canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;touch-action:none;cursor:crosshair}
  .compareGrid canvas:active{cursor:grabbing}
  .compareGrid canvas:focus-visible,.status button:focus-visible{outline:2px solid #bff7ea;outline-offset:-3px}
  @media(max-width:820px){header{align-items:flex-start;flex-direction:column}.compareGrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1>拖拽箭头动效对比</h1><p>固定手牌朝向与 1/3 控制点；拖动任意画面的落点，可同步比较三种动效。</p></div>
  <button id="reset" type="button">重置全部</button>
</header>
<section class="compare" aria-labelledby="compareTitle">
  <div class="compareBar">
    <h2 id="compareTitle">动效对比</h2>
    <div class="status" role="group" aria-label="落点状态">
      <button type="button" data-state="valid" aria-pressed="true" style="--swatch:#ffffff">可施放</button>
      <button type="button" data-state="invalid" aria-pressed="false" style="--swatch:#ff4d6d">不可施放</button>
    </div>
  </div>
  <div class="compareGrid">
    <article><div class="info"><h3>07 雾流（已选）</h3></div><canvas data-motion="mist" tabindex="0" aria-label="雾流箭头，拖动落点，或用方向键移动"></canvas></article>
    <article><div class="info"><h3>08 丝带</h3></div><canvas data-motion="silk" tabindex="0" aria-label="丝带箭头，拖动落点，或用方向键移动"></canvas></article>
    <article><div class="info"><h3>09 水纹</h3></div><canvas data-motion="water" tabindex="0" aria-label="水纹箭头，拖动落点，或用方向键移动"></canvas></article>
  </div>
</section>
<footer>07 雾流已接入游戏；此页仅用于动效对比。</footer>
<script>
const boards=[...document.querySelectorAll('canvas[data-motion]')].map(canvas=>({canvas,ctx:canvas.getContext('2d'),motion:canvas.dataset.motion}));
const start={x:110,y:222},home={x:315,y:64},target={...home};
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)');
const palettes={valid:[255,255,255],invalid:[255,77,109]};
let state='valid',drag=null,impulse=0;
const bound=(value,min,max)=>Math.max(min,Math.min(max,value));

function moveTarget(x,y){
  const nextX=bound(x,28,392),nextY=bound(y,26,194);
  impulse=bound(impulse+(nextX-target.x)*.16,-6,6);
  target.x=nextX;target.y=nextY;
}

function arrowSamples(motion,time){
  const reach=Math.hypot(target.x-start.x,target.y-start.y);
  const control={x:start.x,y:start.y-reach/3};
  const angle=Math.atan2(target.y-control.y,target.x-control.x),gap=Math.min(19,reach*.5);
  const end={x:target.x-Math.cos(angle)*gap,y:target.y-Math.sin(angle)*gap};
  return Array.from({length:49},(_,i)=>{
    const t=i/48,u=1-t;
    const dx=u*(control.x-start.x)+t*(end.x-control.x),dy=u*(control.y-start.y)+t*(end.y-control.y);
    const length=Math.hypot(dx,dy)||1,nx=-dy/length,ny=dx/length;
    const sway=motion==='silk'?Math.sin(Math.PI*t)**2*(Math.sin(t*9-time*3.1)*5+impulse):0;
    return {t,x:u*u*start.x+2*u*t*control.x+t*t*end.x+nx*sway,
      y:u*u*start.y+2*u*t*control.y+t*t*end.y+ny*sway,nx,ny,w:1.9+14*u**1.3};
  });
}

function drawBand(ctx,points,edge){
  ctx.beginPath();
  for(let side=1;side>=-1;side-=2){
    for(let i=0;i<points.length;i++){
      const p=points[side===1?i:points.length-1-i],offset=edge(p,side);
      const x=p.x+p.nx*offset,y=p.y+p.ny*offset;
      if(side===1&&i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
  }
  ctx.closePath();
}

function drawBoard({canvas,ctx,motion},time){
  const scale=Math.min(devicePixelRatio||1,2),width=Math.round(420*scale),height=Math.round(280*scale);
  if(canvas.width!==width||canvas.height!==height){canvas.width=width;canvas.height=height;}
  ctx.setTransform(canvas.width/420,0,0,canvas.height/280,0,0);
  ctx.fillStyle='#101e23';ctx.fillRect(0,0,420,280);
  ctx.strokeStyle='#26383b';ctx.lineWidth=1;ctx.beginPath();
  for(let x=-280;x<700;x+=36){ctx.moveTo(x,0);ctx.lineTo(x+280,280);ctx.moveTo(x,0);ctx.lineTo(x-280,280);}
  ctx.stroke();

  const [r,g,b]=palettes[state];
  const ink=(alpha,light=0)=>`rgba(${Math.round(r+(255-r)*light)},${Math.round(g+(255-g)*light)},${Math.round(b+(255-b)*light)},${alpha})`;
  const points=arrowSamples(motion,time),tip=points[points.length-1];
  const gradient=ctx.createLinearGradient(start.x,start.y,tip.x,tip.y);
  gradient.addColorStop(0,ink(.045));gradient.addColorStop(.32,ink(.23));gradient.addColorStop(.72,ink(.52));gradient.addColorStop(1,ink(.94));
  ctx.fillStyle=gradient;
  drawBand(ctx,points,(p,side)=>side*p.w);ctx.fill();

  ctx.save();ctx.clip();
  if(motion==='mist'){
    for(let layer=0;layer<3;layer++){
      const fog=ctx.createLinearGradient(start.x,start.y,tip.x,tip.y);
      for(let i=0;i<=24;i++){
        const t=i/24,wave=.5+.5*Math.sin(t*23-time*3+layer*2.1);
        fog.addColorStop(t,ink((.015+.24*wave*wave)*Math.min(1,t*5)*(1-t*.60),.44));
      }
      ctx.fillStyle=fog;ctx.filter='blur(2px)';
      drawBand(ctx,points,(p,side)=>p.w*(Math.sin(p.t*11-time*2+layer*2)*.32+side*.43));ctx.fill();
    }
  }else if(motion==='silk'){
    const sheen=ctx.createLinearGradient(start.x,start.y,tip.x,tip.y);
    sheen.addColorStop(0,ink(.04,.35));sheen.addColorStop(.55,ink(.33,.40));sheen.addColorStop(1,ink(.36,.26));
    ctx.fillStyle=sheen;
    drawBand(ctx,points,(p,side)=>p.w*(.40*Math.sin(p.t*11-time*3.1)+side*.36));ctx.fill();
    ctx.fillStyle=ink(.17,.46);
    drawBand(ctx,points,(p,side)=>p.w*(.63*Math.sin(p.t*9-time*3.1+.65)+side*.10));ctx.fill();
  }else{
    ctx.filter='blur(.65px)';ctx.lineCap='round';
    for(let i=0;i<10;i++){
      const t=(i/10+time*.32)%1,p=points[Math.round(t*48)];
      const dx=p.ny,dy=-p.nx,w=p.w;
      ctx.beginPath();ctx.moveTo(p.x-p.nx*w-dx*6,p.y-p.ny*w-dy*6);
      ctx.quadraticCurveTo(p.x+dx*12,p.y+dy*12,p.x+p.nx*w-dx*6,p.y+p.ny*w-dy*6);
      ctx.lineWidth=1.5;ctx.strokeStyle=ink(.52*Math.sin(Math.PI*t),.48);ctx.stroke();
    }
  }
  ctx.restore();

  const dx=tip.ny,dy=-tip.nx,bx=tip.x-dx*12,by=tip.y-dy*12;
  ctx.fillStyle=ink(.97,.18);ctx.beginPath();ctx.moveTo(tip.x,tip.y);
  ctx.lineTo(bx+tip.nx*5.5,by+tip.ny*5.5);ctx.lineTo(bx+dx*3,by+dy*3);
  ctx.lineTo(bx-tip.nx*5.5,by-tip.ny*5.5);ctx.closePath();ctx.fill();
  ctx.fillStyle=ink(.08);ctx.strokeStyle=ink(.52);ctx.lineWidth=1.35;
  ctx.beginPath();ctx.arc(target.x,target.y,16,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.moveTo(target.x-4,target.y);ctx.lineTo(target.x+4,target.y);
  ctx.moveTo(target.x,target.y-4);ctx.lineTo(target.x,target.y+4);ctx.stroke();
  ctx.fillStyle='#203126';ctx.strokeStyle='#697e6d';
  ctx.beginPath();ctx.roundRect(start.x-18,start.y-2,36,43,5);ctx.fill();ctx.stroke();
  ctx.strokeStyle=ink(.7);ctx.beginPath();ctx.moveTo(start.x-7,start.y+23);ctx.lineTo(start.x,start.y+14);
  ctx.lineTo(start.x+7,start.y+23);ctx.stroke();
}

for(const {canvas} of boards){
  const move=e=>{const r=canvas.getBoundingClientRect();moveTarget((e.clientX-r.left)*420/r.width,(e.clientY-r.top)*280/r.height);};
  canvas.addEventListener('pointerdown',e=>{
    if(e.button!==0||drag)return;
    drag={canvas,id:e.pointerId};canvas.setPointerCapture(e.pointerId);move(e);
  });
  canvas.addEventListener('pointermove',e=>{if(drag?.canvas===canvas&&drag.id===e.pointerId)move(e);});
  canvas.addEventListener('lostpointercapture',e=>{if(drag?.canvas===canvas&&drag.id===e.pointerId)drag=null;});
  canvas.addEventListener('keydown',e=>{
    const shift={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]}[e.key];
    if(!shift)return;e.preventDefault();moveTarget(target.x+shift[0],target.y+shift[1]);
  });
}
const statusButtons=[...document.querySelectorAll('.status button')];
for(const button of statusButtons)button.addEventListener('click',()=>{
  state=button.dataset.state;
  for(const item of statusButtons)item.setAttribute('aria-pressed',String(item.dataset.state===state));
});
function renderComparison(ms){
  impulse*=.91;
  for(const board of boards)drawBoard(board,reducedMotion.matches?0:ms/1000);
  requestAnimationFrame(renderComparison);
}
requestAnimationFrame(renderComparison);

document.querySelector('#reset').addEventListener('click',()=>{
  Object.assign(target,home);impulse=0;
  statusButtons[0].click();
});
</script>
</body>
</html>
